<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CobraTrust — Sign In</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg-1:#062b83;
      --bg-2:#083fbd;
      --bg-3:#0b55d8;
      --blue:#1683ff;
      --blue-2:#0b6df3;
      --white:#fff;
      --muted:#a9c7f5;
      --muted-2:#87aee9;
      --line:rgba(54,151,255,.72);
      --card:rgba(4,39,104,.42);
      --field:rgba(20,73,145,.40);
      --shadow:0 28px 70px rgba(0,18,72,.30);
    }

    html,body{min-height:100%;width:100%}
    body{
      min-height:100vh;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 76% 13%,rgba(39,133,255,.20),transparent 24%),
        radial-gradient(circle at 22% 68%,rgba(0,119,255,.12),transparent 30%),
        linear-gradient(135deg,var(--bg-1) 0%,#062e91 42%,var(--bg-2) 100%);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    body::before{
      content:"";
      position:fixed;
      width:520px;height:520px;
      top:-300px;left:-190px;
      border-radius:50%;
      background:rgba(24,113,238,.40);
      pointer-events:none;
    }
    body::after{
      content:"";
      position:fixed;
      width:430px;height:430px;
      right:-210px;bottom:-245px;
      border-radius:50%;
      border:110px solid rgba(18,104,228,.28);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:52px 20px 32px;
    }

    /* subtle dot fields */
    .page .dots{
      position:fixed;
      width:96px;height:96px;
      background-image:radial-gradient(rgba(45,154,255,.8) 1.7px,transparent 1.7px);
      background-size:24px 24px;
      pointer-events:none;
      opacity:.8;
    }
    .dots-top{top:32px;right:46px}
    .dots-bottom{bottom:54px;left:30px}

    .brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-decoration:none;
      color:#fff;
      margin-bottom:48px;
    }
    .brand-row{display:flex;align-items:center;gap:20px}
    .brand-mark{
      width:82px;height:82px;
      display:grid;place-items:center;
      border-radius:20px;
      background:linear-gradient(145deg,#10a5ff,#0b66ed);
      box-shadow:0 16px 34px rgba(0,123,255,.32),inset 0 1px 0 rgba(255,255,255,.25);
    }
    .brand-mark svg{width:54px;height:54px}
    .brand-name{
      font-size:48px;
      line-height:1;
      font-weight:800;
      letter-spacing:-2px;
    }
    .brand-name .trust{color:#2492ff}
    .brand-tag{
      margin-top:13px;
      font-size:17px;
      color:#b5cdf4;
      letter-spacing:.1px;
    }
    .brand-tag span{margin:0 12px;color:#6da8f1}

    .main{
      width:100%;
      display:flex;
      justify-content:center;
      flex:1;
    }

    .auth-card{
      width:min(660px,100%);
      border:1px solid rgba(39,148,255,.82);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(7,48,117,.48),rgba(3,31,86,.40));
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
      padding:52px 58px 48px;
      backdrop-filter:blur(9px);
    }

    .card-header{margin-bottom:38px}
    .card-headline{
      font-size:42px;
      line-height:1.14;
      font-weight:800;
      letter-spacing:-1.6px;
      color:#fff;
    }
    .card-headline .accent{color:#218dff}
    .card-sub{
      margin-top:19px;
      max-width:560px;
      font-size:20px;
      line-height:1.48;
      color:#bdd1f2;
    }

    #main-container{display:flex;flex-direction:column;gap:0}

    .btn,.submit-btn{
      width:100%;
      min-height:64px;
      border-radius:15px;
      font:600 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      cursor:pointer;
      transition:.18s ease;
    }
    .google-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      border:1.5px solid #218bff;
      background:rgba(5,48,112,.28);
      color:#fff;
    }
    .google-btn:hover{background:rgba(25,102,190,.28);transform:translateY(-1px)}
    .google-btn img{width:27px;height:27px;flex:none}

    .divider{
      display:flex;align-items:center;gap:22px;
      margin:34px 0 31px;
      color:#bdd0f0;
      font-size:17px;
      justify-content:center;
    }
    .divider::before,.divider::after{
      content:"";height:1px;flex:1;background:rgba(55,150,246,.66)
    }

    .auth-form{display:flex;flex-direction:column;gap:25px}
    .field-group{display:flex;flex-direction:column;gap:10px}
    .field-label{
      font-size:17px;
      font-weight:700;
      color:#fff;
    }
    .input-wrap{position:relative}
    .input-icon{
      position:absolute;left:19px;top:50%;
      width:24px;height:24px;
      transform:translateY(-50%);
      color:#a6c9f7;
      pointer-events:none;
    }
    .auth-form input{
      width:100%;
      height:64px;
      padding:0 20px 0 64px;
      border:1.5px solid rgba(53,144,237,.72);
      border-radius:15px;
      outline:none;
      background:var(--field);
      color:#fff;
      font:500 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      transition:.18s ease;
    }
    .auth-form input::placeholder{color:#91b3e4}
    .auth-form input:focus{
      border-color:#2b98ff;
      box-shadow:0 0 0 4px rgba(31,139,255,.13);
      background:rgba(21,78,151,.48);
    }

    .password-row{position:relative}
    .password-row input{padding-right:62px}
    .toggle-password{
      position:absolute;right:14px;top:50%;
      transform:translateY(-50%);
      width:40px;height:40px;
      border:0;background:transparent;color:#9fc4f3;
      cursor:pointer;
      border-radius:9px;
    }
    .toggle-password:hover{background:rgba(255,255,255,.07);color:#fff}

    .forgot{
      align-self:flex-end;
      margin-top:-9px;
      border:0;background:none;
      color:#2690ff;
      font:600 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      cursor:pointer;
    }
    .forgot:hover{text-decoration:underline}

    .submit-btn{
      border:1px solid rgba(79,177,255,.8);
      background:linear-gradient(135deg,#167fff,#0d68f3);
      color:#fff;
      box-shadow:0 12px 26px rgba(0,101,240,.26),inset 0 1px 0 rgba(255,255,255,.22);
      margin-top:2px;
    }
    .submit-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
    .submit-btn:disabled{opacity:.65;cursor:wait;transform:none}

    .submit-content{display:flex;align-items:center;justify-content:center;gap:17px}
    .arrow{font-size:29px;font-weight:400;line-height:1}

    .switch-copy{
      text-align:center;
      margin-top:31px;
      color:#a9c5eb;
      font-size:18px;
    }
    .switch-copy button{
      border:0;background:none;color:#258fff;
      font:700 inherit;cursor:pointer;
    }
    .switch-copy button:hover{text-decoration:underline}

    .back-btn{
      border:0;background:none;color:#a8c3e9;
      display:inline-flex;align-items:center;gap:8px;
      font:600 15px Inter,sans-serif;
      cursor:pointer;margin-bottom:25px;
    }
    .back-btn:hover{color:#fff}

    .form-title{
      font-size:35px;font-weight:800;letter-spacing:-1px;margin-bottom:28px;
    }

    .form-message{
      display:none;
      padding:12px 14px;
      border-radius:11px;
      font-size:14px;
      line-height:1.4;
      margin-top:-5px;
      background:rgba(255,255,255,.07);
      color:#dbeafe;
    }

    .loading-overlay{
      position:fixed;inset:0;
      display:none;align-items:center;justify-content:center;
      background:rgba(2,18,57,.62);
      backdrop-filter:blur(7px);
      z-index:1000;
    }
    .spinner{
      width:46px;height:46px;border-radius:50%;
      border:3px solid rgba(255,255,255,.25);
      border-top-color:#3da2ff;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    footer{
      padding:34px 10px 0;
      text-align:center;
      color:#9dbce8;
      font-size:15px;
    }
    .footer-links{display:none}

    @media(max-width:720px){
      .page{padding:30px 14px 24px}
      .dots-top{display:none}
      .dots-bottom{left:4px;bottom:25px;transform:scale(.7)}
      .brand{margin-bottom:28px}
      .brand-row{gap:11px}
      .brand-mark{width:54px;height:54px;border-radius:14px}
      .brand-mark svg{width:37px;height:37px}
      .brand-name{font-size:30px;letter-spacing:-1.3px}
      .brand-tag{font-size:13px;margin-top:8px}
      .brand-tag span{margin:0 7px}
      .auth-card{
        border-radius:21px;
        padding:30px 20px 29px;
      }
      .card-header{margin-bottom:26px}
      .card-headline{font-size:29px;letter-spacing:-1px}
      .card-sub{font-size:15px;line-height:1.5;margin-top:12px}
      .btn,.submit-btn{min-height:54px;border-radius:12px;font-size:15px}
      .google-btn{gap:11px}
      .google-btn img{width:21px;height:21px}
      .divider{margin:24px 0 22px;font-size:13px;gap:14px}
      .auth-form{gap:18px}
      .field-group{gap:7px}
      .field-label{font-size:14px}
      .auth-form input{height:54px;border-radius:12px;font-size:15px;padding-left:50px}
      .input-icon{left:15px;width:20px;height:20px}
      .password-row input{padding-right:52px}
      .forgot{font-size:14px;margin-top:-5px}
      .switch-copy{font-size:14px;margin-top:23px}
      footer{padding-top:23px;font-size:12px}
    }

    @media(max-height:760px) and (min-width:721px){
      .page{padding-top:28px}
      .brand{margin-bottom:24px}
      .brand-mark{width:66px;height:66px}
      .brand-name{font-size:40px}
      .auth-card{padding-top:34px;padding-bottom:32px}
    }
  </style>

</head>

<body>
<div class="page">
  <span class="dots dots-top" aria-hidden="true"></span>
  <span class="dots dots-bottom" aria-hidden="true"></span>

  <a href="index.html" class="brand" aria-label="CobraTrust home">
    <span class="brand-row">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M32 7 51 14v16c0 13.5-7.9 22.2-19 27C20.9 52.2 13 43.5 13 30V14L32 7Z" fill="white" opacity=".96"/>
          <path d="M24 28.5c1.9-5.7 7.1-8.7 12.6-7.2 3.2.9 5.7 3.2 6.9 6.1" stroke="#0878F4" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M24.5 29.2c.1 6.1 4.4 10.1 9.7 10.1 4.4 0 8-2.4 10-6" stroke="#0878F4" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M28.4 27.5h8.4" stroke="#0878F4" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">Cobra<span class="trust">Trust</span></span>
    </span>
    <span class="brand-tag">Build Trust <span>•</span> Grow Faster</span>
  </a>

  <main class="main">
    <section class="auth-card" aria-label="CobraTrust account access">
      <div class="card-header" id="card-header">
        <h1 class="card-headline">Welcome to <span class="accent">CobraTrust</span></h1>
        <p class="card-sub">Create your account and start building your professional trust profile with powerful tools.</p>
      </div>
      <div id="main-container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CobraTrust. All rights reserved.</p>
  </footer>
</div>

<div class="loading-overlay" id="loading" aria-hidden="true">
  <div class="spinner" aria-label="Loading"></div>
</div>

<!-- ============================
     FIREBASE AUTH — UNCHANGED
     All logic, IDs, and flow preserved exactly.
     Only change: index.html → dashboard.html for authenticated returning users.
============================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyA5Wab9dX0UKqdkTEUKC25SLtREOK2Bcw0",
    authDomain: "portpilot-16d14.firebaseapp.com",
    projectId: "portpilot-16d14",
    storageBucket: "portpilot-16d14.firebasestorage.app",
    messagingSenderId: "941538760648",
    appId: "1:941538760648:web:a7fc4f00e96e0cd40712fd",
    measurementId: "G-FZ23CY4GZQ"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const mainContainer = document.getElementById("main-container");
const cardHeader = document.getElementById("card-header");
const loading = document.getElementById("loading");

// loading
function showLoading(){ loading.style.display = "flex"; }
function hideLoading(){ loading.style.display = "none"; }

// =====================
// FIXED AUTH STATE (SAFE)
// =====================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    renderMain();
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  // If no profile OR not completed → setup
  if (!snap.exists() || snap.data().profileCompleted !== true) {
    window.location.replace("profile-setup.html");
  } else {
    window.location.replace("dashboard.html");
  }
});

// =====================
// MAIN UI
// =====================
function renderMain() {
  cardHeader.style.display = "";

  mainContainer.innerHTML = `
    <button class="btn google-btn" id="google-btn" type="button">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true">
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <form class="auth-form" id="signup-form" novalidate>
      <div class="field-group">
        <label class="field-label" for="signup-name">Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5 20c.8-3.5 3.1-5.3 7-5.3s6.2 1.8 7 5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="signup-name" type="text" placeholder="Your name" autocomplete="name" maxlength="80" required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="signup-email">Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="m5 7 7 5.3L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="signup-email" type="email" placeholder="Email address" autocomplete="email" required>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="signup-password">Password</label>
        <div class="input-wrap password-row">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 10V7.7A4 4 0 0 1 16 7.7V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="15" r="1" fill="currentColor"/>
          </svg>
          <input id="signup-password" type="password" placeholder="Password" autocomplete="new-password" minlength="6" required>
          <button class="toggle-password" type="button" id="toggle-signup-password" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none">
              <path d="M2.5 12s3.4-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.4 5.5-9.5 5.5S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-message" id="form-message" role="alert"></div>

      <button class="submit-btn" type="submit" id="signup-submit">
        <span class="submit-content">Create Account <span class="arrow">→</span></span>
      </button>
    </form>

    <div class="switch-copy">Already have an account? <button type="button" id="login-link">Login</button></div>
  `;

  document.getElementById("google-btn").onclick = googleSignIn;
  document.getElementById("login-link").onclick = () => showForm("Login");
  document.getElementById("toggle-signup-password").onclick = () => {
    const input = document.getElementById("signup-password");
    const btn = document.getElementById("toggle-signup-password");
    input.type = input.type === "password" ? "text" : "password";
    btn.setAttribute("aria-label", input.type === "password" ? "Show password" : "Hide password");
  };

  document.getElementById("signup-form").onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("signup-name").value.trim();
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;

    if (!name || !email || !password) return showFormMessage("Please complete all fields.");
    if (password.length < 6) return showFormMessage("Your password must be at least 6 characters.");

    try {
      showLoading();
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await saveUser(userCredential.user, name);
      window.location.href = "profile-setup.html";
    } catch (err) {
      hideLoading();
      showFormMessage(formatAuthError(err));
    }
  };
}

function showFormMessage(message) {
  const el = document.getElementById("form-message");
  if (!el) return;
  el.textContent = message;
  el.style.display = "block";
}

function formatAuthError(err) {
  const code = err?.code || "";
  const messages = {
    "auth/email-already-in-use": "An account with this email already exists. Try logging in instead.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Please choose a stronger password.",
    "auth/invalid-credential": "The email or password is incorrect.",
    "auth/user-not-found": "No account was found with this email.",
    "auth/wrong-password": "The email or password is incorrect.",
    "auth/popup-closed-by-user": "The Google sign-in window was closed."
  };
  return messages[code] || err?.message || "Something went wrong. Please try again.";
}

function showForm(type) {
  cardHeader.style.display = "none";

  const isLogin = type === "Login";

  mainContainer.innerHTML = `
    <button class="back-btn" id="back-btn" type="button">
      <svg viewBox="0 0 14 14" width="15" height="15" fill="none" aria-hidden="true">
        <polyline points="9 2 4 7 9 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>

    <div class="form-title">${isLogin ? "Welcome back" : "Create your account"}</div>

    <form class="auth-form" id="auth-form" novalidate>
      ${!isLogin ? `
      <div class="field-group">
        <label class="field-label" for="email-name">Full Name</label>
        <div class="input-wrap">
          <input type="text" id="email-name" placeholder="Your name" autocomplete="name" maxlength="80" required>
        </div>
      </div>` : ""}

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="Email address" required autocomplete="email">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap password-row">
          <input type="password" id="password" placeholder="Password" required autocomplete="${isLogin ? "current-password" : "new-password"}">
          <button class="toggle-password" type="button" id="toggle-password" aria-label="Show password">◉</button>
        </div>
      </div>

      ${isLogin ? `<button class="forgot" id="forgot-password" type="button">Forgot password?</button>` : ""}

      <div class="form-message" id="form-message" role="alert"></div>

      <button class="submit-btn" type="submit" id="form-submit">
        <span class="submit-content">${isLogin ? "Log In" : "Create Account"} <span class="arrow">→</span></span>
      </button>
    </form>

    <div class="switch-copy">${isLogin ? "Don't have an account?" : "Already have an account?"} <button type="button" id="switch-link">${isLogin ? "Create Account" : "Login"}</button></div>
  `;

  document.getElementById("back-btn").onclick = renderMain;
  document.getElementById("switch-link").onclick = () => showForm(isLogin ? "Sign Up" : "Login");

  document.getElementById("toggle-password").onclick = () => {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
  };

  if (isLogin) {
    document.getElementById("forgot-password").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return showFormMessage("Enter your email address first.");
      try {
        showLoading();
        await sendPasswordResetEmail(auth, email);
        hideLoading();
        showFormMessage("Password reset instructions have been sent to your email.");
      } catch (err) {
        hideLoading();
        showFormMessage(formatAuthError(err));
      }
    };
  }

  document.getElementById("auth-form").onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const nameEl = document.getElementById("email-name");
    const name = nameEl ? nameEl.value.trim() : "";

    if (!email || !password || (!isLogin && !name)) {
      return showFormMessage("Please complete all fields.");
    }

    try {
      showLoading();

      let userCredential;
      if (isLogin) {
        userCredential = await signInWithEmailAndPassword(auth, email, password);
        await saveUser(userCredential.user);
        window.location.href = "index.html";
      } else {
        userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await saveUser(userCredential.user, name);
        window.location.href = "profile-setup.html";
      }
    } catch (err) {
      hideLoading();
      showFormMessage(formatAuthError(err));
    }
  };
}

// =====================
// GOOGLE LOGIN FIXED
// =====================
async function googleSignIn() {
  try {
    showLoading();

    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);

    await saveUser(result.user);

    window.location.href = "profile-setup.html";

  } catch (err) {
    hideLoading();
    showFormMessage(formatAuthError(err));
  }
}

// =====================
// SAVE USER
// =====================
async function saveUser(user, fullName = "") {
  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    await setDoc(userRef, {
      uid: user.uid,
      email: user.email,
      ...(fullName ? { fullName } : {}),
      createdAt: serverTimestamp(),
      profileCompleted: false
    });
  }
}

// start
renderMain();
